# Before certbot runs: plain HTTP + ACME challenge location.
# certbot --nginx will add the 443 server block and redirects.
# Replace atlas.duckdns.org with your DuckDNS subdomain if different.

server {
    listen 80;
    listen [::]:80;
    server_name atlas.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
